name: Build and Deploy to GKE

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: 'sandeepproject-509608'
  CLUSTER: 'github-cluster'
  CLUSTER_ZONE: 'us-central1'
  REPOSITORY: 'app-repo'
  REPOSITORY_REGION: 'us-central1'
  IMAGE: 'poc-app'
  
  # Workload Identity Federation
  WIF_PROVIDER: 'projects/619305970711/locations/global/workloadIdentityPools/sandeep-wip/providers/github-provider'
  WIF_SA: 'sandeep-sa@sandeepproject-509608.iam.gserviceaccount.com'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Authenticate to Google Cloud using Workload Identity Federation
      - id: 'auth'
        name: 'Obtain access token by using workload identity federation'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SA }}

      # 2. Configure Docker to push to your Artifact Registry
      - name: Connect to Artifact Registry
        run: gcloud auth configure-docker ${{ env.REPOSITORY_REGION }}-docker.pkg.dev -q

      # 3. Download the GKE connection credentials to the runner VM
      - name: Connect to GKE
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.CLUSTER_ZONE }}

      # 4. Build and Push the container image
      - name: Create image tag
        run: echo "IMAGE_TAG=${{ env.REPOSITORY_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:$GITHUB_SHA" >> $GITHUB_ENV

      - name: Lock image version in deployment.yaml
        run: sed -i "s|IMAGE_PLACEHOLDER|${{ env.IMAGE_TAG }}|g" k8s/deployment.yaml

      - name: Build Docker image
        run: docker build --tag "${{ env.IMAGE_TAG }}" .

      - name: Publish Docker image to Google Artifact Registry
        run: docker push "${{ env.IMAGE_TAG }}"

      # 5. Apply the separated manifests to the Autopilot cluster
      - name: Deploy to GKE
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl rollout status deployment/poc-app --timeout=120s
